<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quant</title>
<link rel="icon" type="image/png" href="brand-mark.png">
<style>
  /* Quant shell — extracted clean from the old room: sidebar, clock,
     search, tooltips, account popup, theme system. No network pages,
     no news plumbing, no backend. Pages are skeletons to design on. */
  @font-face {
    font-family: "InterVariable";
    src: url("fonts/InterVariable.woff2") format("woff2");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "JBMono";
    src: url("fonts/JetBrainsMono-Regular.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "JBMono";
    src: url("fonts/JetBrainsMono-Medium.woff2") format("woff2");
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --ink: #0d0d0d;
    --muted: #5d5d5d;
    --faint: #b9bbc0;
    --line: rgba(13, 13, 13, 0.07);
    --line-2: rgba(13, 13, 13, 0.12);
    --pill: #ededed;
    --hover: #f5f5f5;
    --focus: #2557d6;
    --t: 130ms cubic-bezier(0.2, 0, 0, 1);
    --zoom: 1;
    --news-side: 392px;
    --mono: "JBMono", ui-monospace, "SF Mono", Menlo, monospace;
    --pop-ink: #282828;
    --pop-grey: #8f8f8f;
  }
  html[data-theme="dark"] {
    --bg: #111318;
    --panel: #171a20;
    --ink: #e8eaef;
    --muted: #9aa0ab;
    --faint: #565c66;
    --line: rgba(255, 255, 255, 0.08);
    --line-2: rgba(255, 255, 255, 0.14);
    --pill: rgba(255, 255, 255, 0.10);
    --hover: rgba(255, 255, 255, 0.06);
    --pop-ink: #d5d8de;
    --pop-grey: #80858e;
  }
  html[data-theme="dark"] .mark,
  html[data-theme="dark"] .word { filter: invert(1); }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  html { background: var(--bg); }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 14px/1.5 InterVariable, Inter, -apple-system, sans-serif;
    font-feature-settings: "tnum" 1, "lnum" 1;
  }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  button { font: inherit; color: inherit; }

  .frame { display: flex; min-height: calc(100vh / var(--zoom)); }

  .side {
    flex: none;
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 14px 0 14px;
    width: 64px;
    position: sticky;
    top: 0;
    height: calc(100vh / var(--zoom));
  }

  .side-top { display: flex; align-items: center; justify-content: center; min-height: 40px; }
  .brand-btn {
    display: flex; align-items: center; gap: 10px;
    background: none; border: 0; padding: 4px;
    border-radius: 9px;
    cursor: pointer;
    transition: background var(--t), transform var(--t);
  }
  .side[data-state="collapsed"] .brand-btn:hover { background: var(--hover); transform: scale(1.04); }
  .side[data-state="collapsed"] .brand-btn:active { transform: scale(0.97); }
  .brand-btn .mark { display: block; height: 32px; width: auto; }
  .brand-btn .word { display: none; height: 14px; width: auto; }

  .side-collapse {
    display: none;
    width: 32px; height: 32px;
    align-items: center; justify-content: center;
    background: none; border: 0; padding: 0;
    border-radius: 8px;
    color: var(--muted);
    cursor: pointer;
    transition: background var(--t), color var(--t), transform var(--t);
  }
  .side-collapse:hover { background: var(--hover); color: var(--ink); }
  .side-collapse:active { transform: scale(0.94); }
  .side-collapse svg { width: 17px; height: 17px; stroke-width: 1.5; }

  .side[data-state="expanded"] { width: 184px; }
  .side[data-ready] { transition: width 200ms cubic-bezier(0.2, 0, 0, 1); }
  .side[data-state="expanded"] .side-top {
    justify-content: flex-start;
    padding: 0 10px 0 14px;
  }
  .side[data-state="expanded"] .brand-btn { cursor: default; flex: 1; }
  .side[data-state="expanded"] .brand-btn .mark { height: 28px; }
  .side[data-state="expanded"] .brand-btn .word { display: block; }
  .side[data-state="expanded"] .side-collapse { display: flex; }

  .side nav { display: flex; flex-direction: column; gap: 12px; margin-top: 26px; align-items: center; }
  .nav-row {
    display: flex; align-items: center; justify-content: center;
    width: 40px; height: 40px;
    border-radius: 10px;
    color: var(--muted);
    text-decoration: none;
    transition: background var(--t), color var(--t), transform var(--t);
  }
  .nav-row .nm { display: none; font-size: 13.5px; }
  a.nav-row:hover { background: var(--hover); color: var(--ink); transform: translateX(1px); }
  a.nav-row:active { transform: scale(0.97); }
  .nav-row.active { background: var(--pill); color: var(--ink); }
  .nav-row svg { width: 22px; height: 22px; stroke-width: 1.5; flex: none; transition: transform var(--t); }
  a.nav-row:hover svg { transform: scale(1.06); }
  .side[data-state="expanded"] nav { align-items: stretch; padding: 0 10px; }
  .side[data-state="expanded"] .nav-row {
    width: auto;
    justify-content: flex-start;
    gap: 10px;
    padding: 0 10px;
  }
  .side[data-state="expanded"] .nav-row .nm { display: inline; }
  .side[data-state="expanded"] .nav-row.active .nm { font-weight: 500; }

  .profile {
    margin-top: auto;
    display: flex; align-items: center; justify-content: center;
    align-self: center;
    width: 44px; height: 44px;
    background: none; border: 0; padding: 0;
    border-radius: 10px;
    cursor: pointer;
    transition: background var(--t), transform var(--t);
  }
  .profile:hover { background: var(--hover); }
  .profile:active { transform: scale(0.96); }
  .avatar {
    position: relative;
    width: 34px; height: 34px;
    border-radius: 50%;
    flex: none;
    background: #16255f url("avatar.png") center / cover no-repeat;
  }
  .avatar::after {
    content: "";
    position: absolute;
    right: -2px; bottom: -2px;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: #23262c;
    border: 2.5px solid var(--bg);
    transition: background var(--t);
  }
  .avatar.on::after { background: #2ebd85; }
  .profile .pcol { display: none; min-width: 0; text-align: left; }
  .side[data-state="expanded"] .profile {
    align-self: stretch;
    width: auto;
    margin: auto 10px 0;
    justify-content: flex-start;
    gap: 11px;
    padding: 0 8px;
    height: 56px;
  }
  .side[data-state="expanded"] .profile .avatar { width: 32px; height: 32px; }
  .side[data-state="expanded"] .profile .pcol { display: flex; flex-direction: column; line-height: 1.4; gap: 1px; }
  .profile .pname { font-size: 14px; font-weight: 500; color: var(--ink); }
  .profile .prole { font-size: 12px; color: var(--muted); }

  main { flex: 1; min-width: 0; }

  .page-shell { padding: 72px 40px 56px; }
  .page-sub { font-size: 13.5px; color: var(--muted); }

  .topbar-right {
    position: fixed;
    top: 7px;
    right: 40px;
    z-index: 70;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .clockpill {
    flex: none;
    min-width: 130px;
    height: 42px;
    padding: 5px;
    --clock-accent: var(--focus);
  }
  .clock-command-pill {
    display: inline-flex;
    align-items: center;
    width: 100%;
    height: 32px;
    padding: 0 8px 0 6px;
    border: 0;
    border-radius: 10px;
    color: var(--clock-accent);
  }
  .clock-hourglass-mark {
    display: block;
    flex: 0 0 24px;
    width: 24px;
    height: 24px;
    overflow: visible;
    color: var(--clock-accent);
  }
  .clock-hourglass-rotor {
    transform-box: fill-box;
    transform-origin: center;
    animation: clockHourglassFlip 8.4s cubic-bezier(0.62, 0, 0.28, 1) infinite;
    will-change: transform;
  }
  .clock-hourglass-cap { fill: color-mix(in srgb, currentColor 74%, #545a6d); }
  .clock-hourglass-glass {
    fill: color-mix(in srgb, var(--panel) 90%, transparent);
    stroke: color-mix(in srgb, currentColor 22%, var(--muted));
    stroke-width: 1.25;
    stroke-linejoin: round;
  }
  .clock-hourglass-sand {
    fill: currentColor;
    opacity: 0.72;
    animation: clockSandBreathe 4.2s ease-in-out infinite;
  }
  .clock-hourglass-stream {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.4;
    stroke-linecap: round;
    opacity: 0.64;
    animation: clockSandStream 2.1s ease-in-out infinite;
  }
  .clock-command-time {
    margin-left: 5px;
    color: var(--ink);
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.025em;
    line-height: 18px;
    font-variant-numeric: tabular-nums lining-nums;
    white-space: nowrap;
  }
  .clock-command-bullet {
    flex: 0 0 3px;
    width: 3px;
    height: 3px;
    margin: 0 5px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--clock-accent) 72%, var(--muted));
  }
  .clock-command-zone {
    min-width: 0;
    color: color-mix(in srgb, var(--clock-accent) 82%, var(--ink));
    font-size: 11.5px;
    font-weight: 620;
    letter-spacing: 0.045em;
    line-height: 14px;
    white-space: nowrap;
  }
  @keyframes clockHourglassFlip {
    0%, 39% { transform: rotate(0deg); }
    52%, 89% { transform: rotate(180deg); }
    100% { transform: rotate(360deg); }
  }
  @keyframes clockSandBreathe {
    0%, 100% { opacity: 0.58; }
    50% { opacity: 0.88; }
  }
  @keyframes clockSandStream {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.78; }
  }
  .set-head {
    min-height: 49px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 24px;
    padding-bottom: 5px;
  }
  .set-head b { font-size: 26px; font-weight: 500; line-height: 39px; letter-spacing: -0.02em; color: var(--ink); }
  .set-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .news-acts { width: var(--news-side); }
  .news-acts .news-search { width: auto; flex: 1; }
  .set-action {
    height: 32px;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0 12px;
    border: 1px solid var(--line-2);
    border-radius: 8px;
    background: var(--panel);
    color: var(--ink);
    font-size: 12.5px; font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background var(--t), border-color var(--t), transform var(--t);
  }
  .set-action:hover { background: var(--hover); border-color: var(--faint); }
  .set-action:active { transform: scale(0.97); }
  .set-step { width: 32px; padding: 0; font-family: var(--mono); font-size: 14px; }
  .set-group { display: inline-flex; align-items: center; gap: 8px; }
  .set-value { min-width: 64px; text-align: center; font: 500 12.5px var(--mono); color: var(--ink); }
  .set-status { font-size: 12.5px; color: var(--muted); }
  .set-swatches { display: flex; gap: 10px; }
  .set-swatch {
    width: 22px; height: 22px; padding: 0;
    border: 0; border-radius: 50%;
    background: var(--c);
    cursor: pointer;
    transition: transform var(--t), box-shadow var(--t);
  }
  .set-swatch:hover { transform: scale(1.1); }
  .set-swatch.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--c); }
  html[data-density="compact"] .set-row { min-height: 56px; padding: 8px 0; }
  html[data-density="compact"] .dev-row:not(.dev-head) { min-height: 52px; padding: 8px 0; }
  html[data-density="compact"] .news-row:not(.news-head-row) { min-height: 52px; padding: 8px 0; }
  html[data-density="compact"] .sess-row { padding: 6px 10px; }
  html[data-density="compact"] .news-source-row { padding: 7px 2px; }
  [hidden] { display: none !important; }
  .set-switch {
    width: 32px; height: 18px; padding: 0;
    border: 0; border-radius: 9px;
    background: var(--faint);
    position: relative; cursor: pointer;
    transition: background var(--t);
  }
  .set-switch::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff;
    transition: transform var(--t);
  }
  .set-switch.on { background: var(--focus); }
  .set-switch.on::after { transform: translateX(14px); }
  html[data-font="system"] body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  html[data-smoothing="on"] body { -webkit-font-smoothing: antialiased; }
  .set-tabs { display: flex; align-items: center; gap: 8px; margin-top: 22px; overflow-x: auto; }
  .set-section { padding-top: 28px; }
  .set-row {
    min-height: 72px;
    display: grid; grid-template-columns: minmax(320px, 1fr) auto;
    align-items: center; gap: 26px;
    padding: 13px 0;
    border-bottom: 1px solid var(--line);
  }
  .set-col { min-width: 0; }
  .set-title { font-size: 13px; font-weight: 500; line-height: 19px; color: var(--ink); }
  .set-sub { margin-top: 2px; font-size: 12px; line-height: 16px; color: var(--muted); }
  .set-seg {
    display: flex; padding: 2px;
    border: 1px solid var(--line-2); border-radius: 8px;
    background: var(--hover);
  }
  .set-seg-btn {
    min-height: 27px; padding: 3px 12px;
    border: 0; border-radius: 6px;
    background: none;
    font: inherit; font-size: 12px; color: var(--muted);
    cursor: pointer;
  }
  .set-seg-btn.on { color: var(--ink); background: var(--panel); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.10); }
  .set-menu { position: relative; }
  .set-menu-btn {
    height: 32px;
    display: inline-flex; align-items: center; justify-content: space-between;
    padding: 0 10px;
    border: 1px solid var(--line-2); border-radius: 8px;
    background: var(--panel); color: var(--ink);
    font: inherit; font-size: 12.5px;
    cursor: pointer;
  }
  .set-menu-btn::after { content: "\2304"; margin-left: 8px; color: var(--faint); }
  .set-menu-panel {
    position: absolute; right: 0; top: calc(100% + 6px);
    z-index: 80;
    min-width: 120px;
    padding: 4px;
    background: var(--panel);
    border: 1px solid var(--line-2); border-radius: 10px;
    box-shadow: 0 10px 32px rgba(0, 0, 0, 0.12);
  }
  .set-menu-row {
    display: block; width: 100%;
    height: 32px; padding: 0 10px;
    border: 0; border-radius: 7px;
    background: none; text-align: left;
    font: inherit; font-size: 12.5px; color: var(--ink);
    cursor: pointer;
  }
  .set-menu-row:hover { background: var(--hover); }
  .set-menu-row.on { background: var(--pill); }
  .set-section:has(.dev-row) { overflow-x: auto; }
  .set-head-row {
    display: grid; grid-template-columns: 1fr auto;
    padding: 8px 0;
    font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--faint);
  }
  html[data-zebra="on"] .dev-row:not(.dev-head):nth-child(even),
  html[data-zebra="on"] .news-row:not(.news-head-row):nth-child(even) { background: color-mix(in srgb, var(--hover) 60%, transparent); }
  html .set-row:hover, html .dev-row:not(.dev-head):hover { background: var(--hover); }
  .dev-row {
    min-height: 72px;
    min-width: 1280px;
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr)
      minmax(0, 1fr) minmax(0, 1fr) minmax(0, 0.9fr);
    gap: 26px; align-items: center;
    padding: 13px 0;
    border-bottom: 1px solid var(--line);
  }
  .dev-head {
    min-height: 0;
    padding: 8px 0;
    border-bottom: 0;
    font-size: 10px; font-weight: 600; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--faint);
  }
  .dev-name { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--ink); }
  .dev-time, .dev-last, .dev-os, .dev-where {
    font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .dev-ip {
    font-family: var(--mono); font-size: 12.5px; color: var(--muted);
    overflow-wrap: anywhere;
  }
  .dev-dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: #2ebd85; margin-left: 2px; }
  .dev-cur { font-size: 11.5px; color: #2ebd85; margin-left: 6px; white-space: nowrap; }
  .dev-name .sess-ico { width: 24px; height: 24px; }
  .dev-kick { color: #cc2f3c; border-color: rgba(204, 47, 60, 0.30); }
  .dev-kick:hover { background: rgba(204, 47, 60, 0.06); border-color: rgba(204, 47, 60, 0.45); color: #b02a37; }
  .dev-act { justify-self: end; }
  .dev-pages { position: sticky; left: 0; display: flex; justify-content: center; gap: 6px; padding: 20px 0 4px; }
  .dev-page {
    width: 30px; height: 30px;
    border: 1px solid var(--line-2); border-radius: 8px;
    background: var(--panel); color: var(--muted);
    font-size: 12px; cursor: pointer;
  }
  .dev-page:hover { background: var(--hover); color: var(--ink); }
  .dev-page.on { background: var(--focus); border-color: var(--focus); color: #fff; }


  .qsearch {
    position: relative;
    width: 344px;
  }
  .qsearch-box {
    position: relative;
    z-index: 96;
    display: flex;
    align-items: center;
    gap: 10px;
    height: 42px;
    padding: 0 8px 0 14px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--line-2);
    color: var(--muted);
    transition: border-color 0.12s, box-shadow 0.12s, background 0.12s;
  }
  .qsearch-box.on {
    border-color: var(--focus);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 13%, transparent);
  }
  .qsearch-box input {
    flex: 1;
    min-width: 0;
    border: 0;
    background: none;
    outline: none;
    color: var(--ink);
    font-size: 13.5px;
    font-family: inherit;
  }
  .qsearch-box input::placeholder { color: var(--faint); }
  .qsearch-box > svg {
    flex: none;
    width: 15px;
    height: 15px;
    stroke-width: 1.8;
    color: var(--muted);
  }
  .qsearch-k {
    flex: none;
    border: 0;
    background: color-mix(in srgb, var(--ink) 3%, var(--panel));
    border-radius: 8px;
    height: 26px;
    padding: 0 8px;
    font-size: 10.5px;
    font-weight: 680;
    color: var(--muted);
    font-family: var(--mono);
    cursor: pointer;
  }
  .qsearch-k:hover { color: var(--focus); }
  html[data-theme="dark"] .qsearch-box {
    border-color: color-mix(in srgb, var(--line) 88%, #fff 4%);
    background: color-mix(in srgb, var(--panel) 94%, #fff 2%);
  }
  html[data-theme="dark"] .qsearch-box.on {
    box-shadow: none;
  }

  .qsearch {
    --search-beam-speed: 10s;
    --search-beam-width: 34%;
    --search-beam-size: 1px;
    --search-beam-peak: 0.34;
    --search-beam-shadow: 0.10;
  }
  .qsearch.open {
    --search-beam-speed: 4.8s;
    --search-beam-width: 30%;
    --search-beam-size: 2px;
    --search-beam-peak: 0.94;
    --search-beam-shadow: 0.30;
  }
  .search-beam {
    position: absolute;
    inset: 0;
    display: block;
    overflow: hidden;
    border-radius: 999px;
    pointer-events: none;
    z-index: 97;
  }
  .search-beam::before,
  .search-beam::after {
    content: "";
    position: absolute;
    left: 0;
    width: var(--search-beam-width);
    height: var(--search-beam-size);
    border-radius: 999px;
    opacity: 0;
    transform: translate3d(-128%, 0, 0);
    will-change: transform, opacity;
    background:
      radial-gradient(circle at 88% 50%, rgba(255, 255, 255, calc(var(--search-beam-peak) * 0.96)) 0 1.5px, transparent 3px),
      linear-gradient(90deg,
        transparent 0%,
        rgba(56, 189, 248, 0) 12%,
        rgba(56, 189, 248, calc(var(--search-beam-peak) * 0.26)) 34%,
        rgba(37, 99, 235, calc(var(--search-beam-peak) * 0.62)) 66%,
        rgba(255, 255, 255, calc(var(--search-beam-peak) * 0.90)) 86%,
        transparent 100%);
    box-shadow:
      0 0 7px rgba(56, 189, 248, var(--search-beam-shadow)),
      0 0 12px rgba(37, 99, 235, calc(var(--search-beam-shadow) * 0.72));
    animation: searchPairedBeamIdle var(--search-beam-speed) cubic-bezier(0.22, 0.82, 0.18, 1) infinite;
  }
  .search-beam::before { top: 1px; }
  .search-beam::after { bottom: 1px; animation-delay: 0.04s; }
  .qsearch.open .search-beam::before,
  .qsearch.open .search-beam::after {
    animation-name: searchPairedBeamActive;
  }
  @keyframes searchPairedBeamIdle {
    0%, 68%, 100% { opacity: 0; transform: translate3d(-128%, 0, 0); }

  .net-circuit-node-detail { font: 9.5px var(--mono); fill: var(--muted); }
  .net-circuit-pin { stroke: color-mix(in srgb, var(--circuit-state) 54%, var(--line-2)); stroke-width: 1.25; }
  .net-circuit-pin.live { stroke: color-mix(in srgb, var(--circuit-live) 54%, var(--line-2)); }
  .net-circuit-pin.warn { stroke: color-mix(in srgb, var(--circuit-warn) 54%, var(--line-2)); }
  .net-circuit-pin.down { stroke: color-mix(in srgb, var(--circuit-down) 62%, var(--line-2)); stroke-dasharray: 4 3; }
  .net-circuit-pin.idle, .net-circuit-pin.unmeasured {
    stroke: color-mix(in srgb, var(--circuit-idle) 54%, var(--line-2));
    stroke-dasharray: 2.5 2.5;
  }
  .net-circuit-logo { color: var(--muted); }
  .net-circuit-logo.browser { color: #4f76d9; }
  .net-circuit-logo.cloudflare { color: #f38020; }
  .net-circuit-logo.binance { color: #f3ba2f; }
  .net-circuit-logo.news { color: #e87527; }
  .net-circuit-logo path, .net-circuit-logo circle, .net-circuit-logo rect, .net-circuit-logo line,
  .net-circuit-logo polyline { vector-effect: non-scaling-stroke; }
  .net-circuit-core > .net-circuit-surface { fill: color-mix(in srgb, var(--panel) 90%, #eaf0f7); }
  html[data-theme="dark"] .net-circuit-core > .net-circuit-surface { fill: #10161e; }
  .net-circuit-core-head { fill: color-mix(in srgb, var(--circuit-state) 7%, transparent); }
  .net-circuit-core-title { font-size: 13px; font-weight: 650; fill: var(--ink); letter-spacing: 0.015em; }
  .net-circuit-core-meta { font: 10.5px var(--mono); fill: var(--muted); }
  .net-circuit-core-live { font: 500 10px var(--mono); fill: var(--ink); text-anchor: end; }
  .net-circuit-chip .net-circuit-surface { fill: color-mix(in srgb, var(--panel) 96%, #edf2f7); }
  html[data-theme="dark"] .net-circuit-chip .net-circuit-surface { fill: #161d27; }
  html[data-theme="dark"] .net-circuit-node:hover > .net-circuit-surface,
  html[data-theme="dark"] .net-circuit-chip:hover > .net-circuit-surface { fill: #1a222e; }
  .net-circuit-chip-title { font-size: 10.5px; font-weight: 600; fill: var(--ink); }
  .net-circuit-chip-role { font: 10.75px var(--mono); fill: var(--muted); letter-spacing: 0.02em; }
  .net-circuit-chip-value { font: 10.75px var(--mono); fill: var(--ink); }
  .net-circuit-bus {
    fill: color-mix(in srgb, var(--focus) 5%, transparent);
    stroke: color-mix(in srgb, var(--focus) 34%, var(--line-2));
    stroke-width: 1;
  }
  .net-circuit-bus-title { font: 600 10.75px var(--mono); letter-spacing: 0.05em; fill: var(--focus); }
  .net-circuit-bus-value { font: 10.75px var(--mono); fill: var(--muted); }
  .net-circuit-stage-box { fill: color-mix(in srgb, var(--panel) 82%, transparent); stroke: var(--line-2); stroke-width: 1; }
  html[data-theme="dark"] .net-circuit-stage-box { fill: rgba(255, 255, 255, 0.025); }
  .net-circuit-stage-name { font: 600 10.75px var(--mono); letter-spacing: 0.04em; fill: var(--muted); }
  .net-circuit-stage-value { font: 500 10px var(--mono); fill: var(--ink); }
  .net-circuit-stage-arrow { fill: var(--faint); }
  @media (max-width: 1100px) {
    .news-cols { flex-direction: column; }
    .news-side { width: auto; }
  }

  @media (max-width: 700px) {
    .topbar-right {
      left: 64px; right: 0; top: 0;
      padding: 9px 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      gap: 8px;
    }
    .side[data-state="expanded"] ~ main .topbar-right { left: 184px; }
    .qsearch { width: auto; flex: 1; min-width: 0; }
    .qsearch-box input { font-size: 16px; }
    .qsearch-pop { left: 12px; right: 12px; width: auto; transform: none; }
    .page-shell { padding: 88px 16px 48px; }
    .set-row { grid-template-columns: 1fr auto; }
    .net-map { margin-top: 18px; }
  }
</style>
</head>
<body>
<div class="frame">
  <div class="side" id="side" data-state="expanded">
    <div class="side-top">
      <button class="brand-btn" id="brand-btn" aria-label="Expand sidebar" data-tip="Expand" data-kbd="1">
        <img class="mark" src="lockup-mark.png" alt="">
        <img class="word" src="lockup-word.png" alt="Quant">
      </button>
      <button class="side-collapse" id="side-collapse" aria-label="Collapse sidebar" data-tip="Collapse" data-kbd="1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19V5"/><path d="m13 6-6 6 6 6"/><path d="M7 12h14"/></svg>
      </button>
    </div>
    <nav aria-label="Pages">
      <a class="nav-row" href="#overview" data-page="overview" data-tip="Overview" aria-label="Overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>
        <span class="nm">Overview</span>
      </a>
      <a class="nav-row" href="#account" data-page="account" data-tip="Account" aria-label="Account">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M17.925 20.056a6 6 0 0 0-11.851.001"/><circle cx="12" cy="11" r="4"/><circle cx="12" cy="12" r="10"/></svg>
        <span class="nm">Account</span>
      </a>
      <a class="nav-row" href="#markets" data-page="markets" data-tip="Markets" aria-label="Markets">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5v4"/><rect width="4" height="6" x="7" y="9" rx="1"/><path d="M9 15v2"/><path d="M17 3v2"/><rect width="4" height="8" x="15" y="5" rx="1"/><path d="M17 13v3"/><path d="M3 3v16a2 2 0 0 0 2 2h16"/></svg>
        <span class="nm">Markets</span>
      </a>
      <a class="nav-row" href="#basis" data-page="basis" data-tip="Basis" aria-label="Basis">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="m19 8 3 8a5 5 0 0 1-6 0zV7"/><path d="M3 7h1a17 17 0 0 0 8-2 17 17 0 0 0 8 2h1"/><path d="m5 8 3 8a5 5 0 0 1-6 0zV7"/><path d="M7 21h10"/></svg>
        <span class="nm">Basis</span>
      </a>
      <a class="nav-row" href="#volume" data-page="volume" data-tip="Volume" aria-label="Volume">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/></svg>
        <span class="nm">Volume</span>
      </a>
      <a class="nav-row" href="#machine" data-page="machine" data-tip="Machine" aria-label="Machine">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></svg>
        <span class="nm">Machine</span>
      </a>
      <a class="nav-row" href="#logs" data-page="logs" data-tip="Logs" aria-label="Logs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17V7"/><path d="M16 8h-6a2 2 0 0 0 0 4h4a2 2 0 0 1 0 4H8"/><path d="M4 3a1 1 0 0 1 1-1 1.3 1.3 0 0 1 .7.2l.933.6a1.3 1.3 0 0 0 1.4 0l.934-.6a1.3 1.3 0 0 1 1.4 0l.933.6a1.3 1.3 0 0 0 1.4 0l.933-.6a1.3 1.3 0 0 1 1.4 0l.934.6a1.3 1.3 0 0 0 1.4 0l.933-.6A1.3 1.3 0 0 1 19 2a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1 1.3 1.3 0 0 1-.7-.2l-.933-.6a1.3 1.3 0 0 0-1.4 0l-.934.6a1.3 1.3 0 0 1-1.4 0l-.933-.6a1.3 1.3 0 0 0-1.4 0l-.933.6a1.3 1.3 0 0 1-1.4 0l-.934-.6a1.3 1.3 0 0 0-1.4 0l-.933.6a1.3 1.3 0 0 1-.7.2 1 1 0 0 1-1-1z"/></svg>
        <span class="nm">Logs</span>
      </a>
      <a class="nav-row" href="#news" data-page="news" data-tip="News" aria-label="News">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18h-5"/><path d="M18 14h-8"/><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0v-9a2 2 0 0 1 2-2h2"/><rect width="8" height="4" x="10" y="6" rx="1"/></svg>
        <span class="nm">News</span>
      </a>
      <a class="nav-row" href="#network" data-page="network" data-tip="Network" aria-label="Network">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></svg>
        <span class="nm">Network</span>
      </a>
      <a class="nav-row" href="#settings" data-page="settings" data-tip="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        <span class="nm">Settings</span>
      </a>
    </nav>
    <button class="profile" id="profile" aria-controls="pop" aria-expanded="false" aria-label="Account">
      <span class="avatar" aria-hidden="true"></span>
      <span class="pcol">
        <span class="pname">COSMOSGEEK</span>
        <span class="prole">Owner</span>
      </span>
    </button>
  </div>
  <main>
    <div class="topbar-right">
      <div class="clockpill">
        <span class="clock-command-pill">
          <svg class="clock-hourglass-mark" viewBox="0 0 36 36" aria-hidden="true">
            <g class="clock-hourglass-rotor">
              <rect class="clock-hourglass-cap" x="6" y="3" width="24" height="4" rx="2"/>
              <rect class="clock-hourglass-cap" x="6" y="29" width="24" height="4" rx="2"/>
              <path class="clock-hourglass-glass" d="M10 7h16c0 6.2-3.1 8-8 11 4.9 3 8 4.8 8 11H10c0-6.2 3.1-8 8-11-4.9-3-8-4.8-8-11Z"/>
              <path class="clock-hourglass-sand" d="M12.2 9h11.6c-.7 3.2-2.7 4.8-5.8 6.8-3.1-2-5.1-3.6-5.8-6.8Zm0 18c.7-3.2 2.7-4.8 5.8-6.8 3.1 2 5.1 3.6 5.8 6.8H12.2Z"/>
              <path class="clock-hourglass-stream" d="M18 15.4v5.2"/>
            </g>
          </svg>
          <span class="clock-command-time" id="clock">—:—</span>
          <i class="clock-command-bullet" aria-hidden="true"></i>
          <span class="clock-command-zone"></span>
        </span>
      </div>
      <div class="qsearch" id="qsearch">
        <div class="qsearch-box" id="qsearch-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="qsearch-input" type="text" placeholder="Search"
                 aria-label="Search" autocomplete="off" spellcheck="false">
          <button class="qsearch-k" id="qsearch-k" tabindex="-1" title="Focus search (⌘K)">⌘K</button>
        </div>
        <span class="search-beam" aria-hidden="true"></span>
        <div class="qsearch-dim" id="qsearch-dim" hidden></div>
        <div class="qsearch-pop" id="qsearch-pop" hidden></div>
      </div>
    </div>
    <div id="page"></div>
  </main>
</div>

<div class="pop" id="pop" hidden>
  <div class="pop-id">
    <span class="pname">COSMOSGEEK</span>
    <div class="theme-trio" role="group" aria-label="Theme">
      <button class="tbtn" data-theme-set="system" aria-label="System theme" title="System">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
      </button>
      <button class="tbtn" data-theme-set="light" aria-label="Light theme" title="Light">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
      </button>
      <button class="tbtn" data-theme-set="dark" aria-label="Dark theme" title="Dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
      </button>
    </div>
  </div>
  <div class="pop-sep"></div>
  <div id="sessions"></div>
  <div class="pop-sep"></div>
  <a class="pop-row danger">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg>
    Log out
  </a>
</div>

<div id="sess-icons" hidden>
  <svg data-d="monitor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
  <svg data-d="phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
  <svg data-d="tablet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><line x1="12" x2="12.01" y1="18" y2="18"/></svg>
</div>
<div id="news-icons" hidden>
  <svg data-i="refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
  <svg data-i="search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
  <svg data-i="link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
  <svg data-i="x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
</div>
<div id="tip" role="tooltip" aria-hidden="true"></div>
<script src="devices.js"></script>
<script src="shell.js"></script>
</body>
</html>
